<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 624" width="800" height="624" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="4-way handshake message exchange between STA and AP" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>4-way handshake message exchange between STA and AP</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect x="0.5" y="0.5" width="799" height="623" rx="10" fill="#ffffff" stroke="#e5e7eb"/><line x1="250" y1="50" x2="250" y2="612" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/><line x1="550" y1="50" x2="550" y2="612" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/><rect x="175" y="14" width="150" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250" y="37" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">STA (Supplicant)</text><rect x="475" y="14" width="150" height="36" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="550" y="37" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">AP (Authenticator)</text><rect x="225" y="62" width="350" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/><text x="400" y="80" font-size="11.5" text-anchor="middle" font-weight="500" fill="#1f2937">PMK already shared (from PSK, SAE or 802.1X/EAP)</text><rect x="574" y="102" width="214" height="29" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/><text x="584" y="121" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">Generate ANonce</text><text x="400" y="150" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1f2937">Msg1: EAPOL-Key</text><text x="400" y="164" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">ANonce</text><line x1="547" y1="176" x2="255" y2="176" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="12" y="186" width="214" height="59" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/><text x="22" y="205" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">Generate SNonce, then derive</text><text x="22" y="220" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">PTK = PRF(PMK, ANonce,</text><text x="22" y="235" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">SNonce, AA, SPA)</text><rect x="574" y="186" width="214" height="59" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/><text x="584" y="205" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">No Msg2? The AP retries Msg1,</text><text x="584" y="220" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">then sends Deauth with</text><text x="584" y="235" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">reason code 15</text><text x="400" y="268" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1f2937">Msg2: EAPOL-Key</text><text x="400" y="282" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">SNonce, RSNE, MIC</text><line x1="253" y1="294" x2="545" y2="294" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="574" y="304" width="214" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/><text x="584" y="323" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">Derive PTK and verify</text><text x="584" y="338" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">the Msg2 MIC</text><rect x="12" y="304" width="214" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/><text x="22" y="323" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">Wrong PSK: the MIC check</text><text x="22" y="338" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">fails and the handshake loops</text><text x="400" y="372" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1f2937">Msg3: EAPOL-Key</text><text x="400" y="386" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">ANonce, RSNE, GTK (encrypted), MIC, Install</text><line x1="547" y1="398" x2="255" y2="398" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="12" y="408" width="214" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/><text x="22" y="427" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">Verify MIC and RSNE,</text><text x="22" y="442" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">install PTK and GTK</text><rect x="574" y="408" width="214" height="59" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/><text x="584" y="427" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">RSNE differs from the</text><text x="584" y="442" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">Association exchange:</text><text x="584" y="457" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">Deauth reason code 17</text><text x="400" y="486" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1f2937">Msg4: EAPOL-Key</text><text x="400" y="500" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">MIC (final acknowledgement)</text><line x1="253" y1="512" x2="545" y2="512" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="574" y="522" width="214" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/><text x="584" y="541" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">Install PTK, open the</text><text x="584" y="556" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">802.1X controlled port</text><text x="400" y="586" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">Encrypted data (PTK / GTK)</text><line x1="255" y1="598" x2="545" y2="598" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)" marker-start="url(#arr)"/></svg>