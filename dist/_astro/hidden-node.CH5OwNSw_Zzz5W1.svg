<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Hidden node problem and the RTS/CTS remedy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Hidden node problem and the RTS/CTS remedy</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect x="0.5" y="0.5" width="799" height="339" rx="10" fill="#ffffff" stroke="#e5e7eb"/><line x1="400" y1="20" x2="400" y2="300" stroke="#e5e7eb" stroke-width="1.5"/><text x="195" y="30" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">Hidden node problem</text><circle cx="109" cy="168" r="100" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="281" cy="168" r="100" fill="#ea580c" fill-opacity="0.08" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="128" y1="168" x2="173" y2="168" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/><line x1="262" y1="168" x2="217" y2="168" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrO)"/><circle cx="109" cy="168" r="17" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="109" y="172.5" font-size="13" text-anchor="middle" font-weight="700" fill="#2563eb">A</text><circle cx="281" cy="168" r="17" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/><text x="281" y="172.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ea580c">B</text><circle cx="195" cy="168" r="19" fill="#334155" stroke="#334155" stroke-width="2"/><text x="195" y="172.5" font-size="12.5" text-anchor="middle" font-weight="700" fill="#ffffff">AP</text><line x1="186" y1="116" x2="204" y2="134" stroke="#dc2626" stroke-width="3.5"/><line x1="204" y1="116" x2="186" y2="134" stroke="#dc2626" stroke-width="3.5"/><text x="195" y="108" font-size="12" text-anchor="middle" font-weight="700" fill="#dc2626">collision</text><text x="195" y="292" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">A and B cannot hear each other,</text><text x="195" y="309" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">so both sense an idle channel,</text><text x="195" y="326" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">transmit together and collide at the AP.</text><text x="595" y="30" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">RTS/CTS remedy</text><circle cx="595" cy="168" r="100" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="528" y1="154" x2="573" y2="154" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/><text x="551.0" y="148" font-size="10.5" text-anchor="middle" font-weight="700" fill="#2563eb">1 RTS</text><line x1="573" y1="171" x2="528" y2="171" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/><text x="551.0" y="185" font-size="10.5" text-anchor="middle" font-weight="700" fill="#16a34a">2 CTS</text><line x1="617" y1="171" x2="662" y2="171" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/><text x="639.0" y="185" font-size="10.5" text-anchor="middle" font-weight="700" fill="#16a34a">2 CTS</text><line x1="528" y1="194" x2="573" y2="194" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/><text x="551.0" y="208" font-size="10.5" text-anchor="middle" font-weight="700" fill="#2563eb">3 Data</text><circle cx="509" cy="168" r="17" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="509" y="172.5" font-size="13" text-anchor="middle" font-weight="700" fill="#2563eb">A</text><circle cx="681" cy="168" r="17" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/><text x="681" y="172.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ea580c">B</text><circle cx="595" cy="168" r="19" fill="#334155" stroke="#334155" stroke-width="2"/><text x="595" y="172.5" font-size="12.5" text-anchor="middle" font-weight="700" fill="#ffffff">AP</text><text x="681" y="124" font-size="11.5" text-anchor="middle" font-weight="700" fill="#ea580c">sets NAV,</text><text x="681" y="138" font-size="11.5" text-anchor="middle" font-weight="700" fill="#ea580c">stays silent</text><text x="595" y="292" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">The AP's CTS is heard by both stations:</text><text x="595" y="309" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">B sets its NAV and stays silent</text><text x="595" y="326" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">until A's frame exchange ends.</text></svg>