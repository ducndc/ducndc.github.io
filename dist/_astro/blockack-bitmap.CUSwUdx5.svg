<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Block Ack bitmap example showing selective retransmission" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Block Ack bitmap example showing selective retransmission</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect x="0.5" y="0.5" width="799" height="371" rx="10" fill="#ffffff" stroke="#e5e7eb"/><text x="20" y="26" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">Selective retransmission with the Block Ack bitmap (SSN = 100)</text><line x1="100" y1="58" x2="702" y2="58" stroke="#6b7280" stroke-width="1"/><line x1="100" y1="58" x2="100" y2="63" stroke="#6b7280" stroke-width="1"/><line x1="702" y1="58" x2="702" y2="63" stroke="#6b7280" stroke-width="1"/><text x="401.0" y="51" font-size="11" text-anchor="middle" font-weight="600" fill="#6b7280">Originator window (never larger than the negotiated buffer size)</text><text x="12" y="87" font-size="12" text-anchor="start" font-weight="700" fill="#1f2937">MPDUs</text><text x="12" y="102" font-size="12" text-anchor="start" font-weight="700" fill="#1f2937">sent</text><text x="12" y="159" font-size="12" text-anchor="start" font-weight="700" fill="#1f2937">BA</text><text x="12" y="174" font-size="12" text-anchor="start" font-weight="700" fill="#1f2937">bitmap</text><text x="12" y="260" font-size="12" text-anchor="start" font-weight="700" fill="#1f2937">Resend</text><rect x="100" y="70" width="70" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="135.0" y="87" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">SN 100</text><text x="135.0" y="103" font-size="10.5" text-anchor="middle" font-weight="400" fill="#15803d">received</text><line x1="135.0" y1="110" x2="135.0" y2="142" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/><rect x="100" y="142" width="70" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="135.0" y="169" font-size="17" text-anchor="middle" font-weight="700" fill="#15803d">1</text><text x="135.0" y="197" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">bit 0</text><rect x="176" y="70" width="70" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="211.0" y="87" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">SN 101</text><text x="211.0" y="103" font-size="10.5" text-anchor="middle" font-weight="400" fill="#15803d">received</text><line x1="211.0" y1="110" x2="211.0" y2="142" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/><rect x="176" y="142" width="70" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="211.0" y="169" font-size="17" text-anchor="middle" font-weight="700" fill="#15803d">1</text><text x="211.0" y="197" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">bit 1</text><rect x="252" y="70" width="70" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="287.0" y="87" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">SN 102</text><text x="287.0" y="103" font-size="10.5" text-anchor="middle" font-weight="400" fill="#15803d">received</text><line x1="287.0" y1="110" x2="287.0" y2="142" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/><rect x="252" y="142" width="70" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="287.0" y="169" font-size="17" text-anchor="middle" font-weight="700" fill="#15803d">1</text><text x="287.0" y="197" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">bit 2</text><rect x="328" y="70" width="70" height="40" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/><text x="363.0" y="87" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">SN 103</text><text x="363.0" y="103" font-size="10.5" text-anchor="middle" font-weight="400" fill="#b91c1c">lost</text><line x1="363.0" y1="110" x2="363.0" y2="142" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/><rect x="328" y="142" width="70" height="40" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="363.0" y="169" font-size="17" text-anchor="middle" font-weight="700" fill="#b91c1c">0</text><text x="363.0" y="197" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">bit 3</text><path d="M363.0 204 L363.0 233" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/><rect x="328" y="236" width="70" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="363.0" y="253" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">SN 103</text><text x="363.0" y="269" font-size="10.5" text-anchor="middle" font-weight="400" fill="#c2410c">resend</text><rect x="404" y="70" width="70" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="439.0" y="87" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">SN 104</text><text x="439.0" y="103" font-size="10.5" text-anchor="middle" font-weight="400" fill="#15803d">received</text><line x1="439.0" y1="110" x2="439.0" y2="142" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/><rect x="404" y="142" width="70" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="439.0" y="169" font-size="17" text-anchor="middle" font-weight="700" fill="#15803d">1</text><text x="439.0" y="197" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">bit 4</text><rect x="480" y="70" width="70" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="515.0" y="87" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">SN 105</text><text x="515.0" y="103" font-size="10.5" text-anchor="middle" font-weight="400" fill="#15803d">received</text><line x1="515.0" y1="110" x2="515.0" y2="142" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/><rect x="480" y="142" width="70" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="515.0" y="169" font-size="17" text-anchor="middle" font-weight="700" fill="#15803d">1</text><text x="515.0" y="197" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">bit 5</text><rect x="556" y="70" width="70" height="40" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/><text x="591.0" y="87" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">SN 106</text><text x="591.0" y="103" font-size="10.5" text-anchor="middle" font-weight="400" fill="#b91c1c">lost</text><line x1="591.0" y1="110" x2="591.0" y2="142" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/><rect x="556" y="142" width="70" height="40" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="591.0" y="169" font-size="17" text-anchor="middle" font-weight="700" fill="#b91c1c">0</text><text x="591.0" y="197" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">bit 6</text><path d="M591.0 204 L591.0 233" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/><rect x="556" y="236" width="70" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="591.0" y="253" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">SN 106</text><text x="591.0" y="269" font-size="10.5" text-anchor="middle" font-weight="400" fill="#c2410c">resend</text><rect x="632" y="70" width="70" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="667.0" y="87" font-size="12" text-anchor="middle" font-weight="700" fill="#1f2937">SN 107</text><text x="667.0" y="103" font-size="10.5" text-anchor="middle" font-weight="400" fill="#15803d">received</text><line x1="667.0" y1="110" x2="667.0" y2="142" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/><rect x="632" y="142" width="70" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="667.0" y="169" font-size="17" text-anchor="middle" font-weight="700" fill="#15803d">1</text><text x="667.0" y="197" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">bit 7</text><text x="20" y="306" font-size="12" text-anchor="start" font-weight="600" fill="#1f2937">Bit n = 1 means the MPDU with sequence number SSN + n was received. Only the zeros are resent.</text><text x="20" y="326" font-size="11.5" text-anchor="start" font-weight="400" fill="#6b7280">On the wire this first octet is 0xB7, because bit 0 is the least significant bit.</text><text x="20" y="346" font-size="11.5" text-anchor="start" font-weight="400" fill="#6b7280">Bitmap size follows the window: 64 bits (HT/VHT), 256 bits (HE), 1024 bits (EHT).</text></svg>