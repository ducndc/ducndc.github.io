<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 296" width="800" height="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="DFS timeline: CAC, operation with in-service monitoring, radar event and channel move" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>DFS timeline: CAC, operation with in-service monitoring, radar event and channel move</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect x="0.5" y="0.5" width="799" height="295" rx="10" fill="#ffffff" stroke="#e5e7eb"/><rect x="14" y="58" width="160" height="112" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="94.0" y="84" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">1. CAC</text><text x="94.0" y="108" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">Listen only, no TX</text><text x="94.0" y="126" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">60 s, or 10 min on</text><text x="94.0" y="144" font-size="12" text-anchor="middle" font-weight="400" fill="#1f2937">5600-5650 MHz</text><line x1="176" y1="114.0" x2="190" y2="114.0" strok