t-size="11" text-anchor="end" font-weight="400" fill="#6b7280">time</text><rect x="438" y="236" width="348" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/><text x="612" y="261" font-size="12" text-anchor="middle" font-weight="600" fill="#334155">Old channel: Non-Occupancy Period, 30 min</text><text x="14" y="261" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">Other channels stay usable</text></svg>