<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="AP MLD advertising a consistent RSNO2E across its 2.4 GHz, 5 GHz and 6 GHz affiliated links">
  <rect x="0.5" y="0.5" width="819" height="399" rx="10" fill="#ffffff" stroke="#e7e7e7"/>

  <rect x="310" y="20" width="200" height="50" rx="8" fill="#efefef" stroke="#606060" stroke-width="1.6"/>
  <text x="410" y="42" font-size="13" text-anchor="middle" font-weight="700" fill="#282828">AP MLD</text>
  <text x="410" y="58" font-size="10.5" text-anchor="middle" fill="#727272">3 affiliated APs, one SSID</text>

  <line x1="410" y1="70" x2="150" y2="128" stroke="#a1a1a1" stroke-width="1.4"/>
  <line x1="410" y1="70" x2="410" y2="128" stroke="#a1a1a1" stroke-width="1.4"/>
  <line x1="410" y1="70" x2="670" y2="128" stroke="#a1a1a1" stroke-width="1.4"/>

  <rect x="20" y="128" width="260" height="42" rx="6" fill="#e8e8e8" stroke="#606060" stroke-width="1.3"/>
  <text x="150" y="154" font-size="12.5" text-anchor="middle" font-weight="700" fill="#282828">Link 1 &#183; 2.4 GHz</text>
  <rect x="280" y="128" width="260" height="42" rx="6" fill="#e8e8e8" stroke="#606060" stroke-width="1.3"/>
  <text x="410" y="154" font-size="12.5" text-anchor="middle" font-weight="700" fill="#282828">Link 2 &#183; 5 GHz</text>
  <rect x="540" y="128" width="260" height="42" rx="6" fill="#e8e8e8" stroke="#606060" stroke-width="1.3"/>
  <text x="670" y="154" font-size="12.5" text-anchor="middle" font-weight="700" fill="#282828">Link 3 &#183; 6 GHz</text>

  <rect x="20" y="190" width="260" height="50" rx="5" fill="#f4f4f4" stroke="#a1a1a1" stroke-width="1.2"/>
  <text x="30" y="208" font-size="10.8" fill="#282828">RSNE: AKM 2 (WPA2-PSK)</text>
  <text x="30" y="224" font-size="10.8" fill="#282828">CCMP-128 &#8212; legacy compat</text>

  <rect x="280" y="190" width="260" height="50" rx="5" fill="#f4f4f4" stroke="#a1a1a1" stroke-width="1.2"/>
  <text x="290" y="208" font-size="10.8" fill="#282828">RSNE: AKM 2 (WPA2-PSK)</text>
  <text x="290" y="224" font-size="10.8" fill="#282828">CCMP-128 &#8212; legacy compat</text>

  <rect x="540" y="190" width="260" height="50" rx="5" fill="#f4f4f4" stroke="#a1a1a1" stroke-width="1.2"/>
  <text x="550" y="208" font-size="10.8" fill="#282828">RSNE: AKM 8 (SAE / WPA3)</text>
  <text x="550" y="224" font-size="10.8" fill="#282828">WPA2-PSK not allowed in 6 GHz</text>

  <text x="410" y="262" font-size="10" text-anchor="middle" fill="#9a9a9a">the base RSNE is free to differ, link by link</text>

  <rect x="20" y="276" width="260" height="50" rx="5" fill="#e2e2e2" stroke="#4d4d4d" stroke-width="1.3"/>
  <text x="30" y="294" font-size="10.8" fill="#282828">RSNO2E: AKM 24 (SAE-EXT-KEY)</text>
  <text x="30" y="310" font-size="10.8" fill="#282828">GCMP-256</text>

  <rect x="280" y="276" width="260" height="50" rx="5" fill="#e2e2e2" stroke="#4d4d4d" stroke-width="1.3"/>
  <text x="290" y="294" font-size="10.8" fill="#282828">RSNO2E: AKM 24 (SAE-EXT-KEY)</text>
  <text x="290" y="310" font-size="10.8" fill="#282828">GCMP-256</text>

  <rect x="540" y="276" width="260" height="50" rx="5" fill="#e2e2e2" stroke="#4d4d4d" stroke-width="1.3"/>
  <text x="550" y="294" font-size="10.8" fill="#282828">RSNO2E: AKM 24 (SAE-EXT-KEY)</text>
  <text x="550" y="310" font-size="10.8" fill="#282828">GCMP-256</text>

  <rect x="12" y="270" width="796" height="62" rx="10" fill="none" stroke="#282828" stroke-width="2.4"/>

  <text x="410" y="350" font-size="11.5" text-anchor="middle" fill="#282828">An AP MLD using RSN overriding MUST advertise the identical RSNO2E (and RSNXOE, if used) in the Beacon</text>
  <text x="410" y="366" font-size="11.5" text-anchor="middle" fill="#282828">and Probe Response of every affiliated AP &#8212; whatever the base RSNE on that link looks like.</text>
  <text x="410" y="386" font-size="10" text-anchor="middle" fill="#a1a1a1">Source: Wi-Fi Alliance, "Achieving secure network connectivity for all devices" v1.0 (Feb 2025)</text>
</svg>
