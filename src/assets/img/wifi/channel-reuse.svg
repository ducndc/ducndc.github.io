<circle cx="633.0" cy="132.8" r="14" fill="#ea580c"/>
<text x="633.0" y="136.8" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">11</text>
<text x="600" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">The same channel is reused only two cells away</text>
<text x="600" y="344" text-anchor="middle" font-size="12" fill="#334155">Overlap is kept between different channels</text>
<text x="400.0" y="368" text-anchor="middle" font-size="11" fill="#6b7280">Circles show each AP's coverage. The number in the dot is the 2.4 GHz channel.</text>
