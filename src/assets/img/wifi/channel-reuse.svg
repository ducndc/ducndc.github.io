<text x="266.0" y="194.0" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
<circle cx="233.0" cy="247.2" r="14" fill="#dc2626"/>
<text x="233.0" y="251.2" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
<circle cx="167.0" cy="247.2" r="14" fill="#dc2626"/>
<text x="167.0" y="251.2" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
<circle cx="134.0" cy="190.0" r="14" fill="#dc2626"/>
