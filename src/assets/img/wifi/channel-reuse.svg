<text x="200" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">Neighbouring cells overlap on one channel</text>
<text x="200" y="344" text-anchor="middle" font-size="12" fill="#334155">They contend for the same airtime (CCI)</text>
