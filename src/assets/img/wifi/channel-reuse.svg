<circle cx="567.0" cy="247.2" r="14" fill="#16a34a"/>
<text x="567.0" y="251.2" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
<circle cx="534.0" cy="190.0" r="14" fill="#ea580c"/>
