<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="How RSN overriding blocks a downgrade: the RSN Selection element and the Beacon-versus-message-3 consistency check">
  <defs>
    <marker id="dArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f3f3f"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="679" rx="10" fill="#ffffff" stroke="#e7e7e7"/>

  <rect x="175" y="14" width="150" height="36" rx="6" fill="#e8e8e8" stroke="#606060" stroke-width="2"/>
  <text x="250" y="37" font-size="12.5" text-anchor="middle" font-weight="700" fill="#282828">STA (RSN overriding)</text>
  <rect x="475" y="14" width="150" height="36" rx="6" fill="#efefef" stroke="#727272" stroke-width="2"/>
  <text x="550" y="37" font-size="12.5" text-anchor="middle" font-weight="700" fill="#282828">AP MLD (RSN overriding)</text>

  <line x1="250" y1="50" x2="250" y2="660" stroke="#d4d4d4" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="550" y1="50" x2="550" y2="660" stroke="#d4d4d4" stroke-width="2" stroke-dasharray="5 4"/>

  <text x="400" y="72" font-size="12.5" text-anchor="middle" font-weight="700" fill="#282828">Beacon / Probe Response</text>
  <text x="400" y="86" font-size="9.5" text-anchor="middle" fill="#727272">RSNE + RSNOE + RSNO2E (+ RSNXOE)</text>
  <line x1="545" y1="98" x2="255" y2="98" stroke="#3f3f3f" stroke-width="2" marker-end="url(#dArr)"/>

  <rect x="12" y="108" width="214" height="50" rx="6" fill="#f4f4f4" stroke="#7f7f7f" stroke-width="1.3"/>
  <text x="22" y="127" font-size="11" fill="#282828">STA is configured for Wi-Fi 7 /</text>
  <text x="22" y="142" font-size="11" fill="#282828">SAE-EXT-KEY, so it selects RSNO2E</text>

  <text x="400" y="186" font-size="12.5" text-anchor="middle" font-weight="700" fill="#282828">(Re)Association Request</text>
  <text x="400" y="200" font-size="9.5" text-anchor="middle" fill="#727272">RSNE (AKM 24, GCMP-256) + RSN Selection element: &#8220;RSNO2E&#8221;</text>
  <line x1="255" y1="212" x2="545" y2="212" stroke="#3f3f3f" stroke-width="2" marker-end="url(#dArr)"/>

  <text x="400" y="240" font-size="12.5" text-anchor="middle" font-weight="700" fill="#282828">(Re)Association Response</text>
  <text x="400" y="254" font-size="10.5" text-anchor="middle" fill="#727272">Status: success</text>
  <line x1="545" y1="266" x2="255" y2="266" stroke="#3f3f3f" stroke-width="2" marker-end="url(#dArr)"/>

  <text x="400" y="294" font-size="12.5" text-anchor="middle" font-weight="700" fill="#282828">Msg1: EAPOL-Key</text>
  <text x="400" y="308" font-size="10.5" text-anchor="middle" fill="#727272">ANonce</text>
  <line x1="545" y1="320" x2="255" y2="320" stroke="#3f3f3f" stroke-width="2" marker-end="url(#dArr)"/>

  <text x="400" y="348" font-size="12.5" text-anchor="middle" font-weight="700" fill="#282828">Msg2: EAPOL-Key</text>
  <text x="400" y="362" font-size="10.5" text-anchor="middle" fill="#727272">SNonce with WFA cookie, RSNE, RSN Selection KDE, MIC</text>
  <line x1="255" y1="374" x2="545" y2="374" stroke="#3f3f3f" stroke-width="2" marker-end="url(#dArr)"/>

  <rect x="574" y="384" width="214" height="58" rx="6" fill="#e8e8e8" stroke="#4d4d4d" stroke-width="1.3"/>
  <text x="584" y="402" font-size="11" fill="#282828">AP checks: RSN Selection in the</text>
  <text x="584" y="417" font-size="11" fill="#282828">Assoc Req equals Msg2&#8217;s.</text>
  <text x="584" y="432" font-size="11" font-weight="700" fill="#282828">Mismatch &#8594; abort the 4WH</text>

  <text x="400" y="462" font-size="12.5" text-anchor="middle" font-weight="700" fill="#282828">Msg3: EAPOL-Key</text>
  <text x="400" y="476" font-size="9.5" text-anchor="middle" fill="#727272">RSNE + RSNOE/RSNO2E/RSNXOE as advertised (per link for MLO), GTK, MIC</text>
  <line x1="545" y1="488" x2="255" y2="488" stroke="#3f3f3f" stroke-width="2" marker-end="url(#dArr)"/>

  <rect x="12" y="498" width="214" height="78" rx="6" fill="#e2e2e2" stroke="#282828" stroke-width="1.8"/>
  <text x="22" y="516" font-size="11" fill="#282828">STA checks: byte-identical to</text>
  <text x="22" y="531" font-size="11" fill="#282828">the Beacon / Probe Response?</text>
  <text x="22" y="546" font-size="11" fill="#282828">(checked per link, for MLO)</text>
  <text x="22" y="564" font-size="11" font-weight="700" fill="#282828">NOT identical &#8594; ABORT the 4WH</text>

  <text x="400" y="604" font-size="12.5" text-anchor="middle" font-weight="700" fill="#282828">Msg4: EAPOL-Key</text>
  <text x="400" y="618" font-size="10.5" text-anchor="middle" fill="#727272">MIC (final acknowledgement)</text>
  <line x1="255" y1="630" x2="545" y2="630" stroke="#3f3f3f" stroke-width="2" marker-end="url(#dArr)"/>

  <text x="400" y="650" font-size="12" text-anchor="middle" font-weight="700" fill="#282828">Encrypted data (PTK / GTK)</text>
  <line x1="255" y1="660" x2="545" y2="660" stroke="#3f3f3f" stroke-width="2.5" marker-end="url(#dArr)" marker-start="url(#dArr)"/>
</svg>
