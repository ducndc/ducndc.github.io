<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 274" width="800" height="274" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="CCA thresholds: preamble detection and energy detection levels" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>CCA thresholds: preamble detection and energy detection levels</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect x="0.5" y="0.5" width="799" height="273" rx="10" fill="#ffffff" stroke="#e5e7eb"/><rect x="40" y="96" width="216" height="68" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="148.0" y="120" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">Idle</text><text x="148.0" y="139" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">Signal too weak to defer;</text><text x="148.0" y="155" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">the device may transmit</text><rect x="256" y="96" width="240" height="68" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="376.0" y="120" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">Wi-Fi signals only</text><text x="376.0" y="139" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">Busy if a valid 802.11</text><text x="376.0" y="155" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">preamble is decoded</text><rect x="496" y="96" width="264" height="68" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="628.0" y="120" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2937">Any signal</text><text x="628.0" y="139" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">Busy: Wi-Fi or non-Wi-Fi</text><text x="628.0" y="155" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2937">energy (CCA-ED)</text><line x1="256" y1="66" x2="256" y2="172" stroke="#334155" stroke-width="2"/><text x="256" y="38" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Preamble detection (CCA-CS)</text><text x="256" y="56" font-size="12.5" text-anchor="middle" font-weight="700" fill="#b45309">-82 dBm</text><line x1="496" y1="66" x2="496" y2="172" stroke="#334155" stroke-width="2"/><text x="496" y="38" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Energy detection (CCA-ED)</text><text x="496" y="56" font-size="12.5" text-anchor="middle" font-weight="700" fill="#b91c1c">-62 dBm</text><line x1="40" y1="172" x2="40" y2="178" stroke="#6b7280" stroke-width="1"/><text x="40" y="192" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">-100</text><line x1="160" y1="172" x2="160" y2="178" stroke="#6b7280" stroke-width="1"/><text x="160" y="192" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">-90</text><line x1="280" y1="172" x2="280" y2="178" stroke="#6b7280" stroke-width="1"/><text x="280" y="192" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">-80</text><line x1="400" y1="172" x2="400" y2="178" stroke="#6b7280" stroke-width="1"/><text x="400" y="192" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">-70</text><line x1="520" y1="172" x2="520" y2="178" stroke="#6b7280" stroke-width="1"/><text x="520" y="192" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">-60</text><line x1="640" y1="172" x2="640" y2="178" stroke="#6b7280" stroke-width="1"/><text x="640" y="192" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">-50</text><line x1="760" y1="172" x2="760" y2="178" stroke="#6b7280" stroke-width="1"/><text x="760" y="192" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">-40</text><line x1="256" y1="206" x2="496" y2="206" stroke="#7c3aed" stroke-width="1.5"/><line x1="256" y1="201" x2="256" y2="211" stroke="#7c3aed" stroke-width="1.5"/><line x1="496" y1="201" x2="496" y2="211" stroke="#7c3aed" stroke-width="1.5"/><text x="376.0" y="226" font-size="11.5" text-anchor="middle" font-weight="600" fill="#6d28d9">OBSS_PD range: Wi-Fi 6 spatial reuse may raise the busy threshold</text><text x="376.0" y="242" font-size="11.5" text-anchor="middle" font-weight="600" fill="#6d28d9">for frames from other BSSs (with reduced transmit power)</text><text x="20" y="264" font-size="10.5" text-anchor="start" font-weight="400" fill="#6b7280">Signal level in dBm. Typical values for a 20 MHz primary channel.</text></svg>