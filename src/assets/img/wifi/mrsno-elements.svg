<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Beacon frame carrying RSNE, RSNOE, RSNO2E and RSNXOE, and which client reads which element">
  <defs>
    <marker id="mArr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a9a"/></marker>
    <marker id="mArr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#727272"/></marker>
    <marker id="mArr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#282828"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="599" rx="10" fill="#ffffff" stroke="#e7e7e7"/>
  <text x="410" y="27" font-size="14" text-anchor="middle" font-weight="700" fill="#282828">Beacon / Probe Response: one frame, three RSN profiles</text>

  <text x="34" y="52" font-size="11" font-weight="600" fill="#727272">INFORMATION ELEMENTS IN THE FRAME BODY</text>
  <rect x="20" y="60" width="356" height="468" rx="8" fill="none" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="34" y="78" width="328" height="96" rx="6" fill="#e8e8e8" stroke="#606060" stroke-width="1.3"/>
  <text x="46" y="98" font-size="12.5" font-weight="700" fill="#282828">RSNE (base element)</text>
  <text x="46" y="116" font-size="11" fill="#282828">AKM 00-0F-AC:2 &#8212; PSK (WPA2-Personal)</text>
  <text x="46" y="132" font-size="11" fill="#282828">Pairwise cipher: CCMP-128</text>
  <text x="46" y="151" font-size="10.5" font-style="italic" fill="#727272">Every 802.11 device parses this element</text>

  <rect x="34" y="190" width="328" height="96" rx="6" fill="#f4f4f4" stroke="#7f7f7f" stroke-width="1.3"/>
  <text x="46" y="210" font-size="12.5" font-weight="700" fill="#282828">RSNOE &#8212; RSN Override</text>
  <text x="46" y="228" font-size="11" fill="#282828">AKM 00-0F-AC:8 &#8212; SAE (WPA3-Personal)</text>
  <text x="46" y="244" font-size="11" fill="#282828">Pairwise cipher: CCMP-128 or GCMP-256</text>
  <text x="46" y="263" font-size="10.5" font-style="italic" fill="#727272">WFA vendor-specific element &#8212; legacy STAs skip it</text>

  <rect x="34" y="302" width="328" height="96" rx="6" fill="#e8e8e8" stroke="#4d4d4d" stroke-width="1.5"/>
  <text x="46" y="322" font-size="12.5" font-weight="700" fill="#282828">RSNO2E &#8212; RSN Override 2</text>
  <text x="46" y="340" font-size="11" fill="#282828">AKM 00-0F-AC:24 &#8212; SAE-EXT-KEY</text>
  <text x="46" y="356" font-size="11" fill="#282828">Pairwise cipher: GCMP-256</text>
  <text x="46" y="375" font-size="10.5" font-style="italic" fill="#727272">Required, byte-identical, on every EHT/MLO link</text>

  <rect x="34" y="414" width="328" height="90" rx="6" fill="#f4f4f4" stroke="#a1a1a1" stroke-width="1.3"/>
  <text x="46" y="434" font-size="12.5" font-weight="700" fill="#282828">RSNXOE &#8212; RSNXE Override</text>
  <text x="46" y="452" font-size="11" fill="#282828">Extended RSN capabilities (H2E, PMF-related bits)</text>
  <text x="46" y="470" font-size="10.5" font-style="italic" fill="#727272">Only ever sent alongside an RSNOE or RSNO2E</text>

  <text x="596" y="52" font-size="11" font-weight="600" fill="#727272" text-anchor="middle">WHICH STA USES WHICH ELEMENT</text>

  <rect x="500" y="92" width="290" height="88" rx="6" fill="#efefef" stroke="#9a9a9a" stroke-width="1.3"/>
  <text x="514" y="114" font-size="12.5" font-weight="700" fill="#282828">Legacy WPA2 STA</text>
  <text x="514" y="132" font-size="11" fill="#282828">Reads RSNE only. RSNOE / RSNO2E /</text>
  <text x="514" y="148" font-size="11" fill="#282828">RSNXOE are unknown vendor elements,</text>
  <text x="514" y="164" font-size="11" fill="#282828">so they are silently skipped.</text>

  <rect x="500" y="204" width="290" height="88" rx="6" fill="#efefef" stroke="#727272" stroke-width="1.3"/>
  <text x="514" y="226" font-size="12.5" font-weight="700" fill="#282828">WPA3 STA (Wi-Fi 5/6/6E)</text>
  <text x="514" y="244" font-size="11" fill="#282828">Recognizes RSN overriding, picks the</text>
  <text x="514" y="260" font-size="11" fill="#282828">RSNOE profile &#8212; SAE with CCMP-128</text>
  <text x="514" y="276" font-size="11" fill="#282828">or GCMP-256.</text>

  <rect x="500" y="316" width="290" height="88" rx="6" fill="#e2e2e2" stroke="#282828" stroke-width="1.6"/>
  <text x="514" y="338" font-size="12.5" font-weight="700" fill="#282828">Wi-Fi 7 / MLO STA</text>
  <text x="514" y="356" font-size="11" fill="#282828">MUST use RSNO2E when the AP</text>
  <text x="514" y="372" font-size="11" fill="#282828">advertises it &#8212; never RSNOE or RSNE</text>
  <text x="514" y="388" font-size="11" fill="#282828">for an MLO (re)association.</text>

  <line x1="362" y1="126" x2="500" y2="136" stroke="#9a9a9a" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#mArr1)"/>
  <line x1="362" y1="238" x2="500" y2="248" stroke="#727272" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#mArr2)"/>
  <line x1="362" y1="350" x2="500" y2="360" stroke="#282828" stroke-width="2.2" marker-end="url(#mArr3)"/>

  <rect x="20" y="536" width="780" height="50" rx="6" fill="#f4f4f4" stroke="#d4d4d4" stroke-width="1.2"/>
  <text x="410" y="556" font-size="11.5" text-anchor="middle" fill="#282828">A STA that used RSN overriding signals its choice back with a new <tspan font-weight="700">RSN Selection element</tspan> in the</text>
  <text x="410" y="573" font-size="11.5" text-anchor="middle" fill="#282828">(Re)Association Request and EAPOL-Key message 2 &#8212; it never re-sends the RSNOE/RSNO2E/RSNXOE itself.</text>
</svg>
