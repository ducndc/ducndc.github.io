<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="ADDBA Request frame body and the Block Ack Parameter Set bit fields" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>ADDBA Request frame body and the Block Ack Parameter Set bit fields</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><rect x="0.5" y="0.5" width="799" height="379" rx="10" fill="#ffffff" stroke="#e5e7eb"/><text x="20" y="26" font-size="13" text-anchor="start" font-weight="700" fill="#1f2937">ADDBA Request action frame body</text><polygon points="320,168 470,168 768,214 32,214" fill="#dbeafe" opacity="0.45"/><rect x="40" y="42" width="90" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="85.0" y="63" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2937">Category</text><text x="85.0" y="105" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1 B</text><text x="85.0" y="121" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">3 = Block Ack</text><rect x="130" y="42" width="100" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="180.0" y="63" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2937">Block Ack</text><text x="180.0" y="78" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2937">Action</text><text x="180.0" y="105" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1 B</text><text x="180.0" y="121" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">0 ADDBA Req</text><text x="180.0" y="134" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">1 ADDBA Resp</text><text x="180.0" y="147" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">2 DELBA</text><rect x="230" y="42" width="90" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="275.0" y="63" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2937">Dialog</text><text x="275.0" y="78" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2937">Token</text><text x="275.0" y="105" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">1 B</text><text x="275.0" y="121" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">pairs Req</text><text x="275.0" y="134" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">with Resp</text><rect x="320" y="42" width="150" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="395.0" y="63" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2937">Block Ack</text><text x="395.0" y="78" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2937">Param. Set</text><text x="395.0" y="105" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">2 B</text><rect x="470" y="42" width="120" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="530.0" y="63" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2937">Block Ack</text><text x="530.0" y="78" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2937">Timeout</text><text x="530.0" y="105" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">2 B</text><text x="530.0" y="121" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">in TUs, 0 = off</text><rect x="590" y="42" width="170" height="48" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="675.0" y="63" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2937">Starting Seq</text><text x="675.0" y="78" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1f2937">Control</text><text x="675.0" y="105" font-size="11" text-anchor="middle" font-weight="400" fill="#6b7280">2 B</text><text x="675.0" y="121" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">4-bit fragment (0)</text><text x="675.0" y="134" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6b7280">+ 12-bit SSN</text><line x1="320" y1="168" x2="32" y2="214" stroke="#93c5fd" stroke-width="1"/><line x1="470" y1="168" x2="768" y2="214" stroke="#93c5fd" stroke-width="1"/><rect x="32" y="214" width="46" height="48" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/><text x="55.0" y="235" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">A-MSDU</text><text x="55.0" y="249" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Supp.</text><text x="55.0" y="277" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">B0</text><rect x="78" y="214" width="46" height="48" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/><text x="101.0" y="235" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">BA</text><text x="101.0" y="249" font-size="9.5" text-anchor="middle" font-weight="600" fill="#1f2937">Policy</text><text x="101.0" y="277" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">B1</text><rect x="124" y="214" width="184" height="48" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/><text x="216.0" y="243" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">TID</text><text x="216.0" y="277" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">B2-B5</text><rect x="308" y="214" width="460" height="48" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/><text x="538.0" y="243" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2937">Buffer Size</text><text x="538.0" y="277" font-size="10" text-anchor="middle" font-weight="400" fill="#6b7280">B6-B15</text><text x="32" y="306" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">BA Policy: 1 = Immediate Block Ack, 0 = Delayed Block Ack.</text><text x="32" y="324" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">TID: the traffic identifier (0-15) this agreement covers. One agreement per TID and direction.</text><text x="32" y="342" font-size="11.5" text-anchor="start" font-weight="400" fill="#1f2937">Buffer Size: how many MPDUs the recipient can buffer, which caps the originator window.</text><text x="32" y="360" font-size="11.5" text-anchor="start" font-weight="400" fill="#6b7280">In the ADDBA Response, a Status Code follows the Dialog Token and Starting Sequence Control is absent.</text></svg>